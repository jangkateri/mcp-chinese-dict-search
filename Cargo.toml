[package]
name = "mcp-chinese-dict-search"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "MCP stdio server for searching a local Markdown dictionary"
license = "MIT"
keywords = ["mcp", "chinese-medicine", "dictionary", "search", "stdio"]
categories = ["command-line-utilities"]

[[bin]]
name = "mcp-chinese-dict-search"
path = "src/main.rs"

[dependencies]
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
jsonschema = { version = "0.63.1", default-features = false }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
